name: Build and push Docker image

on:
  push:
    branches: [main]
  # Tests only (the build job is skipped): a red test belongs on the PR, not
  # after the merge that has already started building an image.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile, so the SIGTERM behaviour is asserted on the
      # runtime the container actually runs.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.0.x

      - run: bun install

      - run: bun run test

  build:
    needs: test
    # A PR gets the test job and stops there; nothing is pushed to GHCR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mimoprotocol/mimo-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
